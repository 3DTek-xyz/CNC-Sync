name: Pages Site
run-name: Pages Site

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy-pages-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download_run_artifact() {
            local run_id="$1"
            local artifact_name="$2"
            local target_dir="$3"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$target_dir"; then
              echo "No workflow artifact named $artifact_name matched for $target_dir; continuing."
            fi
          }

          run_id="${{ github.event.workflow_run.id }}"
          mkdir -p site
          cp -R docs/. site/
          mkdir -p site/downloads/win site/downloads/macos site/downloads/linux site/updates
          download_run_artifact "$run_id" "windows-downloads" site/downloads/win
          download_run_artifact "$run_id" "macos-release-arm64-downloads" site/downloads/macos
          download_run_artifact "$run_id" "macos-release-x64-downloads" site/downloads/macos
          download_run_artifact "$run_id" "linux-downloads" site/downloads/linux
          download_run_artifact "$run_id" "windows-update-feed" site/updates
          download_run_artifact "$run_id" "macos-release-arm64-update-feed" site/updates
          download_run_artifact "$run_id" "macos-release-x64-update-feed" site/updates
          download_run_artifact "$run_id" "linux-update-feed" site/updates
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
