name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Allows manual triggering

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for proper versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install WiX Toolset
      run: dotnet tool install --global wix --version 5.0.1
      
    - name: Restore NuGet packages
      run: dotnet restore

    - name: Extract version from tag
      id: version
      run: |
        if ("${{ github.ref }}" -like "refs/tags/v*") {
          $version = "${{ github.ref }}".Replace("refs/tags/v", "")
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "VERSION_WITH_V=v$version" >> $env:GITHUB_OUTPUT
        } else {
          echo "VERSION=1.0.0" >> $env:GITHUB_OUTPUT
          echo "VERSION_WITH_V=v1.0.0" >> $env:GITHUB_OUTPUT
        }
      shell: powershell

    - name: Update version in Package.wxs
      run: |
        $packageFile = "src/CBWSSSync.Installer/Package.wxs"
        $content = Get-Content $packageFile -Raw
        $newContent = $content -replace 'Version="[\d\.]+"', 'Version="${{ steps.version.outputs.VERSION }}.0"'
        Set-Content $packageFile $newContent
      shell: powershell

    - name: Build Release configuration
      run: dotnet build --configuration Release --no-restore

    - name: Restore WiX Installer dependencies
      run: dotnet restore src/CBWSSSync.Installer/CBWSSSync.Installer.wixproj

    - name: Build MSI Installer
      run: dotnet build src/CBWSSSync.Installer/CBWSSSync.Installer.wixproj --configuration Release

    - name: Generate checksums
      id: checksums
      run: |
        $msiPath = "bin/Release/CBWSSSync.Installer.msi"
        if (Test-Path $msiPath) {
          $hash = Get-FileHash $msiPath -Algorithm SHA512
          $checksum = $hash.Hash
          echo "MSI_CHECKSUM=$checksum" >> $env:GITHUB_OUTPUT
          echo "MSI_SIZE=$((Get-Item $msiPath).Length)" >> $env:GITHUB_OUTPUT
          
          # Rename MSI to include version
          $versionedName = "CBWSS-Sync-Setup-${{ steps.version.outputs.VERSION_WITH_V }}.msi"
          Move-Item $msiPath "bin/Release/$versionedName"
          echo "MSI_FILENAME=$versionedName" >> $env:GITHUB_OUTPUT
        } else {
          echo "MSI file not found!" 
          exit 1
        }
      shell: powershell

    - name: Update update.xml
      shell: powershell
      run: |
        $updateFile = "update.xml"
        $version = "${{ steps.version.outputs.VERSION }}.0"
        $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION_WITH_V }}/${{ steps.checksums.outputs.MSI_FILENAME }}"
        $changelogUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.VERSION_WITH_V }}"
        $checksum = "${{ steps.checksums.outputs.MSI_CHECKSUM }}"
        
        $updateXml = @'
        <?xml version="1.0" encoding="UTF-8"?>
        <item>
            <version>{0}</version>
            <url>{1}</url>
            <changelog>{2}</changelog>
            <mandatory>false</mandatory>
            <args>/QUIET /NORESTART</args>
            <checksum algorithm="SHA512">{3}</checksum>
        </item>
        '@ -f $version, $downloadUrl, $changelogUrl, $checksum
        
        Set-Content $updateFile $updateXml

    - name: Commit updated update.xml
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add update.xml
        git commit -m "Update version to ${{ steps.version.outputs.VERSION_WITH_V }}" || echo "No changes to commit"
        git push origin main || echo "No changes to push"

    - name: Create Release Notes
      id: release_notes
      shell: powershell
      run: |
        $version = "${{ steps.version.outputs.VERSION_WITH_V }}"
        $filename = "${{ steps.checksums.outputs.MSI_FILENAME }}"
        $size = [math]::Round(${{ steps.checksums.outputs.MSI_SIZE }} / 1MB, 2)
        $checksum = "${{ steps.checksums.outputs.MSI_CHECKSUM }}"
        
        $releaseNotes = @"
        # CBWSS-Sync $version
        
        ## 🚀 New Features & Improvements
        
        - Complete Windows Forms GUI with MenuStrip and system tray functionality
        - Automatic service management (install/uninstall/start/stop) with UAC elevation  
        - AutoUpdater.NET integration for seamless automatic updates
        - Enhanced service status verification with Windows Event Log integration
        - Professional MSI installer with proper Windows integration
        - Start Menu and Desktop shortcuts
        - Silent installation support for automated updates
        
        ## 📦 Installation
        
        **Download and run:** $filename
        
        - **Size:** $size MB
        - **SHA512:** $checksum
        
        ## 🔧 Requirements
        
        - Windows 10/11 (x64)
        - .NET 9.0 Runtime (included in installer)
        - Administrator privileges for service installation
        
        ## ⚡ Silent Installation
        
        For automated deployment:
        ```
        msiexec /i $filename /quiet /norestart
        ```
        
        ## 🛡️ Auto-Update
        
        This version includes AutoUpdater.NET - the application will automatically check for and install future updates from GitHub releases.
        
        ---
        
        **Full Changelog:** https://github.com/${{ github.repository }}/compare/v1.0.0...$version
        "@
        
        Set-Content "release-notes.md" $releaseNotes

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION_WITH_V }}
        name: CBWSS-Sync ${{ steps.version.outputs.VERSION_WITH_V }}
        body_path: release-notes.md
        draft: false
        prerelease: false
        files: |
          bin/Release/${{ steps.checksums.outputs.MSI_FILENAME }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cbwss-sync-installer-${{ steps.version.outputs.VERSION_WITH_V }}
        path: |
          bin/Release/${{ steps.checksums.outputs.MSI_FILENAME }}
          update.xml
          release-notes.md
        retention-days: 90