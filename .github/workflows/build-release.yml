name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Allows manual triggering

# Grant permissions for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for proper versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install WiX Toolset
      run: dotnet tool install --global wix --version 5.0.1
      
    - name: Restore NuGet packages
      run: dotnet restore

    - name: Extract version from tag
      id: version
      run: |
        if ("${{ github.ref }}" -like "refs/tags/v*") {
          $version = "${{ github.ref }}".Replace("refs/tags/v", "")
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "VERSION_WITH_V=v$version" >> $env:GITHUB_OUTPUT
        } else {
          echo "VERSION=1.0.0" >> $env:GITHUB_OUTPUT
          echo "VERSION_WITH_V=v1.0.0" >> $env:GITHUB_OUTPUT
        }
      shell: powershell

    # Removed Package.wxs version replacement - WiX binding !(bind.FileVersion.CNCFTPSyncGUI.exe) 
    # automatically uses the correct version from the compiled executable

    - name: Build Release configuration
      run: dotnet build --configuration Release --no-restore -p:ProductVersion=${{ steps.version.outputs.VERSION }}

    - name: Restore WiX Installer dependencies
      run: dotnet restore src/CNCFTPSync.Installer/CNCFTPSync.Installer.wixproj

    - name: Build MSI Installer
      run: dotnet build src/CNCFTPSync.Installer/CNCFTPSync.Installer.wixproj --configuration Release -p:ProductVersion=${{ steps.version.outputs.VERSION }}

    - name: Generate checksums and copy to docs
      id: checksums
      run: |
        $msiPath = "bin/Release/CNCFTPSync.Installer.msi"
        if (Test-Path $msiPath) {
          $hash = Get-FileHash $msiPath -Algorithm SHA512
          $checksum = $hash.Hash
          echo "MSI_CHECKSUM=$checksum" >> $env:GITHUB_OUTPUT
          echo "MSI_SIZE=$((Get-Item $msiPath).Length)" >> $env:GITHUB_OUTPUT
          
          # Create versioned filename
          $versionedName = "CNC-FTP-SYNC-Setup-${{ steps.version.outputs.VERSION_WITH_V }}.msi"
          
          # Ensure docs/installer directory exists
          if (!(Test-Path "docs/installer")) {
            New-Item -ItemType Directory -Force -Path "docs/installer"
          }
          
          # Copy to docs/installer with both generic and versioned names
          Copy-Item $msiPath "docs/installer/CNC-FTP-SYNC-Setup-Latest.msi" -Force
          Copy-Item $msiPath "docs/installer/$versionedName" -Force
          
          # Move original to versioned name for release
          Move-Item $msiPath "bin/Release/$versionedName"
          echo "MSI_FILENAME=$versionedName" >> $env:GITHUB_OUTPUT
          
          Write-Host "✅ MSI copied to docs/installer/"
        } else {
          echo "MSI file not found!" 
          exit 1
        }
      shell: powershell

    - name: Update update.xml
      shell: powershell
      run: |
        $updateFile = "docs/update.xml"
        $version = "${{ steps.version.outputs.VERSION }}"
        $downloadUrl = "https://3dtek-xyz.github.io/CNC-FTPSync/installer/${{ steps.checksums.outputs.MSI_FILENAME }}"
        $changelogUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.VERSION_WITH_V }}"
        $checksum = "${{ steps.checksums.outputs.MSI_CHECKSUM }}"
        
        $updateXml = @'
        <?xml version="1.0" encoding="UTF-8"?>
        <item>
            <version>{0}</version>
            <url>{1}</url>
            <changelog>{2}</changelog>
            <mandatory>false</mandatory>
            <args>/QUIET /NORESTART</args>
            <checksum algorithm="SHA512">{3}</checksum>
        </item>
        '@ -f $version, $downloadUrl, $changelogUrl, $checksum
        
        Set-Content $updateFile $updateXml

    - name: Commit updated files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git config pull.rebase false
        
        # Use force checkout to clean update.xml conflicts
        git checkout -- docs/update.xml || echo "No conflicts to reset"
        git pull origin main || echo "No remote changes to pull"
        
        # Regenerate clean update.xml after pull
        $version = "${{ steps.version.outputs.VERSION }}"
        $downloadUrl = "https://3dtek-xyz.github.io/CNC-FTPSync/installer/${{ steps.checksums.outputs.MSI_FILENAME }}"
        $changelogUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.VERSION_WITH_V }}"
        $checksum = "${{ steps.checksums.outputs.MSI_CHECKSUM }}"
        
        $updateXml = @'
        <?xml version="1.0" encoding="UTF-8"?>
        <item>
            <version>{0}</version>
            <url>{1}</url>
            <changelog>{2}</changelog>
            <mandatory>false</mandatory>
            <args>/QUIET /NORESTART</args>
            <checksum algorithm="SHA512">{3}</checksum>
        </item>
        '@ -f $version, $downloadUrl, $changelogUrl, $checksum
        
        Set-Content "docs/update.xml" $updateXml
        
        git add docs/
        git commit -m "Release ${{ steps.version.outputs.VERSION_WITH_V }} - Update installer and version files" || echo "No changes to commit"
        git push origin main || echo "No changes to push"
      shell: powershell

    - name: Create Release Notes
      id: release_notes
      shell: powershell
      run: |
        $version = "${{ steps.version.outputs.VERSION_WITH_V }}"
        $filename = "${{ steps.checksums.outputs.MSI_FILENAME }}"
        $size = [math]::Round(${{ steps.checksums.outputs.MSI_SIZE }} / 1MB, 2)
        $checksum = "${{ steps.checksums.outputs.MSI_CHECKSUM }}"
        
        $releaseNotes = @"
        # CNC-FTP-SYNC $version
        
        ## 🚀 New Features & Improvements
        
        - Complete Windows Forms GUI with MenuStrip and system tray functionality
        - Automatic service management (install/uninstall/start/stop) with UAC elevation  
        - AutoUpdater.NET integration for seamless automatic updates
        - Enhanced service status verification with Windows Event Log integration
        - Professional MSI installer with proper Windows integration
        - Start Menu and Desktop shortcuts
        - Silent installation support for automated updates
        
        ## 📦 Installation
        
        **Download and run:** $filename
        
        - **Size:** $size MB
        - **SHA512:** $checksum
        
        ## 🔧 Requirements
        
        - Windows 10/11 (x64)
        - .NET 9.0 Runtime (included in installer)
        - Administrator privileges for service installation
        
        ## ⚡ Silent Installation
        
        For automated deployment:
        ```
        msiexec /i $filename /quiet /norestart
        ```
        
        ## 🛡️ Auto-Update
        
        This version includes AutoUpdater.NET - the application will automatically check for and install future updates from GitHub releases.
        
        ---
        
        **Full Changelog:** https://github.com/${{ github.repository }}/compare/v1.0.0...$version
        "@
        
        Set-Content "release-notes.md" $releaseNotes

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION_WITH_V }}
        name: CNC-FTP-SYNC ${{ steps.version.outputs.VERSION_WITH_V }}
        body_path: release-notes.md
        draft: false
        prerelease: false
        files: |
          bin/Release/${{ steps.checksums.outputs.MSI_FILENAME }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cnc-ftp-sync-installer-${{ steps.version.outputs.VERSION_WITH_V }}
        path: |
          bin/Release/${{ steps.checksums.outputs.MSI_FILENAME }}
          update.xml
          release-notes.md
        retention-days: 90