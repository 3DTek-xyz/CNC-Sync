name: Release
run-name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          else
            version="1.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish Windows build
        run: dotnet publish src/CNCSync.App/CNCSync.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }} -p:PostHogProjectApiKey="${{ secrets.POSTHOG_PROJECT_API_KEY }}" -p:PostHogHostUrl="${{ secrets.POSTHOG_HOST_URL }}"
      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version 0.0.1298
      - name: Create Velopack Windows release
        shell: pwsh
        run: |
          ./packaging/windows/package-velopack.ps1 `
            -Root $env:GITHUB_WORKSPACE `
            -Version ${{ steps.version.outputs.version }}
      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist\windows\release-assets"
          $feedDir = Join-Path $env:GITHUB_WORKSPACE "dist\windows\update-feed"
          New-Item -ItemType Directory -Force -Path $releaseDir, $feedDir | Out-Null

          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "dist\windows\velopack") -Filter "*Setup.exe" |
            Copy-Item -Destination $releaseDir
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "dist\windows\velopack") -Filter "*Portable.zip" |
            Copy-Item -Destination $releaseDir

          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "dist\windows\velopack\RELEASES") $feedDir
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "dist\windows\velopack\releases.win.json") $feedDir
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "dist\windows\velopack\assets.win.json") $feedDir
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "dist\windows\velopack") -Filter "*.nupkg" |
            Copy-Item -Destination $feedDir
      - uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: dist/windows/release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: windows-update-feed
          path: dist/windows/update-feed/*

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-arm64
            artifact_name: macos-release-arm64
          - runtime: osx-x64
            artifact_name: macos-release-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          else
            version="1.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish macOS build
        run: dotnet publish src/CNCSync.App/CNCSync.App.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:UseAppHost=true -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }} -p:PostHogProjectApiKey="${{ secrets.POSTHOG_PROJECT_API_KEY }}" -p:PostHogHostUrl="${{ secrets.POSTHOG_HOST_URL }}"
      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 0.0.1298
      - name: Package macOS Velopack release
        run: VERSION=${{ steps.version.outputs.version }} RUNTIME=${{ matrix.runtime }} zsh ./packaging/macos/package-velopack.sh
      - name: Stage macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/dist/macos/release-assets-${{ matrix.runtime }}"
          feed_dir="$GITHUB_WORKSPACE/dist/macos/update-feed-${{ matrix.runtime }}"
          source_dir="$GITHUB_WORKSPACE/dist/macos/velopack-${{ matrix.runtime }}"
          mkdir -p "$release_dir" "$feed_dir"

          find "$source_dir" -maxdepth 1 \( -name '*Setup.pkg' -o -name '*Portable.zip' \) -exec cp {} "$release_dir" \;
          find "$source_dir" -maxdepth 1 \( -name "RELEASES-${{ matrix.runtime }}" -o -name "releases.${{ matrix.runtime }}.json" -o -name "assets.${{ matrix.runtime }}.json" -o -name '*.nupkg' \) -exec cp {} "$feed_dir" \;
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-downloads
          path: dist/macos/release-assets-${{ matrix.runtime }}/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-update-feed
          path: dist/macos/update-feed-${{ matrix.runtime }}/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          else
            version="1.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish Linux build
        run: dotnet publish src/CNCSync.App/CNCSync.App.csproj -c Release -r linux-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }} -p:PostHogProjectApiKey="${{ secrets.POSTHOG_PROJECT_API_KEY }}" -p:PostHogHostUrl="${{ secrets.POSTHOG_HOST_URL }}"
      - name: Install Linux packaging dependency
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 0.0.1298
      - name: Package Linux Velopack release
        run: VERSION=${{ steps.version.outputs.version }} bash ./packaging/linux/package-velopack.sh
      - name: Stage Linux release assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/dist/linux/release-assets"
          feed_dir="$GITHUB_WORKSPACE/dist/linux/update-feed"
          source_dir="$GITHUB_WORKSPACE/dist/linux/velopack-linux-x64"
          mkdir -p "$release_dir" "$feed_dir"

          find "$source_dir" -maxdepth 1 \( -name '*.AppImage' \) -exec cp {} "$release_dir" \;
          find "$source_dir" -maxdepth 1 \( -name 'RELEASES-linux-x64' -o -name 'releases.linux-x64.json' -o -name 'assets.linux-x64.json' -o -name '*.nupkg' \) -exec cp {} "$feed_dir" \;
      - uses: actions/upload-artifact@v4
        with:
          name: linux-downloads
          path: dist/linux/release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-update-feed
          path: dist/linux/update-feed/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-downloads/*
            artifacts/macos-release-arm64-downloads/*
            artifacts/macos-release-x64-downloads/*
            artifacts/linux-downloads/*
