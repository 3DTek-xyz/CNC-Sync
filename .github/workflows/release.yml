name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          else
            version="0.1.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish Windows build
        run: dotnet publish src/CBWSSSync.App/CBWSSSync.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}
      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version 0.0.1298
      - name: Create Velopack Windows release
        shell: pwsh
        run: |
          ./packaging/windows/package-velopack.ps1 `
            -Root $env:GITHUB_WORKSPACE `
            -Version ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/velopack/*

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-arm64
            artifact_name: macos-release-arm64
          - runtime: osx-x64
            artifact_name: macos-release-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          else
            version="0.1.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish macOS build
        run: dotnet publish src/CBWSSSync.App/CBWSSSync.App.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:UseAppHost=true -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}
      - name: Package macOS app
        run: VERSION=${{ steps.version.outputs.version }} RUNTIME=${{ matrix.runtime }} zsh ./packaging/macos/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/macos/*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          else
            version="0.1.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish Linux build
        run: dotnet publish src/CBWSSSync.App/CBWSSSync.App.csproj -c Release -r linux-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -p:InformationalVersion=${{ steps.version.outputs.version }}
      - name: Package Linux tarball
        run: VERSION=${{ steps.version.outputs.version }} bash ./packaging/linux/package-tarball.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/linux/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-release/*
            artifacts/macos-release-arm64/*.zip
            artifacts/macos-release-x64/*.zip
            artifacts/linux-release/*.tar.gz

  deploy-pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows-release
      - name: Prepare GitHub Pages update feed
        run: |
          mkdir -p site
          cp -R docs/. site/
          mkdir -p site/updates/win
          cp artifacts/windows-release/* site/updates/win/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
